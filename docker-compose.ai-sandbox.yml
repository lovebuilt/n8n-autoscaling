# Self-hosted n8n Sandbox Service for Instance AI.
# The runner isolation mode is supplied by either the Sysbox or privileged
# override. API, runner, and SearXNG ports intentionally remain internal.
volumes:
  sandbox_api_tls:
  sandbox_runner_tls:
  sandbox_api_data:

networks:
  sandbox-network:
    driver: bridge

services:
  sandbox-certs:
    image: n8nio/n8n-sandbox-service-api:${N8N_SANDBOX_SERVICE_VERSION:-1.1.1}
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        if [ -s /api-tls/ca.crt ] && [ -s /api-tls/grpc-server.crt ] &&
        [ -s /api-tls/grpc-server.key ] && [ -s /api-tls/control-grpc-api-client.crt ] &&
        [ -s /api-tls/control-grpc-api-client.key ] && [ -s /runner-tls/ca.crt ] &&
        [ -s /runner-tls/grpc-client.crt ] && [ -s /runner-tls/grpc-client.key ] &&
        [ -s /runner-tls/control-grpc-server.crt ] && [ -s /runner-tls/control-grpc-server.key ];
        then echo 'Existing role-specific mTLS material is complete; keeping it.'; exit 0; fi;
        if [ -n "$(ls -A /api-tls 2>/dev/null)" ] || [ -n "$(ls -A /runner-tls 2>/dev/null)" ];
        then echo 'Incomplete mTLS volumes detected; refusing an uncoordinated CA rotation.' >&2; exit 1; fi;
        bootstrap-mtls.sh --out-dir /tls-work --api-san sandbox-api
        --control-san-prefix sandbox-runner &&
        rm -rf /api-tls/* /runner-tls/* &&
        cp -a /tls-work/api/. /api-tls/ &&
        cp -a /tls-work/runner/. /runner-tls/ &&
        chown -R sandbox-api:sandbox-api /api-tls
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - sandbox_api_tls:/api-tls
      - sandbox_runner_tls:/runner-tls
    tmpfs:
      - /tls-work
    network_mode: none

  sandbox-api:
    image: n8nio/n8n-sandbox-service-api:${N8N_SANDBOX_SERVICE_VERSION:-1.1.1}
    restart: unless-stopped
    logging:
      driver: ${LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS:?Run ./n8n-setup.sh to generate sandbox secrets}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:?Run ./n8n-setup.sh to generate sandbox secrets}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY:?Run ./n8n-setup.sh to generate sandbox secrets}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox_api_tls:/tls:ro
      - sandbox_api_data:/var/lib/n8n-sandbox-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - sandbox-network

  sandbox-runner-1:
    image: n8nio/n8n-sandbox-service-runner-dind:${N8N_SANDBOX_SERVICE_VERSION:-1.1.1}
    restart: unless-stopped
    logging:
      driver: ${LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_RUNNER_API_KEYS:?Run ./n8n-setup.sh to generate sandbox secrets}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_RUNNER_REGISTRATION_TOKEN:?Run ./n8n-setup.sh to generate sandbox secrets}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: http://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: n8nio/n8n-sandbox-service-sandbox:${N8N_SANDBOX_IMAGE_VERSION:-1.1.0}
      SANDBOX_RUNNER_CAPACITY_TOTAL: ${SANDBOX_RUNNER_CAPACITY_TOTAL:-1000}
      SANDBOX_RUNNER_IDLE_TTL_SECONDS: ${SANDBOX_RUNNER_IDLE_TTL_SECONDS:-3600}
      SANDBOX_RUNNER_DEFAULT_MEMORY_MB: ${SANDBOX_RUNNER_DEFAULT_MEMORY_MB:-512}
      SANDBOX_RUNNER_DEFAULT_CPU_PERCENT: ${SANDBOX_RUNNER_DEFAULT_CPU_PERCENT:-100}
      SANDBOX_RUNNER_DEFAULT_PIDS_MAX: ${SANDBOX_RUNNER_DEFAULT_PIDS_MAX:-256}
      SANDBOX_RUNNER_DEFAULT_DISK_QUOTA_MB: ${SANDBOX_RUNNER_DEFAULT_DISK_QUOTA_MB:-0}
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/ca.crt
    volumes:
      - sandbox_runner_tls:/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - sandbox-network

  searxng:
    image: ghcr.io/searxng/searxng:${SEARXNG_VERSION:-2026.8.28-a30b2d474}
    restart: unless-stopped
    logging:
      driver: ${LOG_DRIVER:-json-file}
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run ./n8n-setup.sh to generate the SearXNG secret}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - sandbox-network

  n8n:
    environment:
      N8N_SANDBOX_SERVICE_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: ${N8N_SANDBOX_SERVICE_API_KEY:?Run ./n8n-setup.sh to generate sandbox secrets}
      N8N_INSTANCE_AI_SEARXNG_URL: http://searxng:8080
    depends_on:
      sandbox-api:
        condition: service_healthy
    networks:
      - sandbox-network
