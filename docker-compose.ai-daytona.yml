# Daytona-backed sandbox provider for n8n Instance AI.
services:
  n8n:
    environment:
      DAYTONA_API_URL: ${DAYTONA_API_URL:?Set DAYTONA_API_URL in .env or run ./n8n-setup.sh}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:?Set DAYTONA_API_KEY in .env or run ./n8n-setup.sh}
      N8N_INSTANCE_AI_SANDBOX_IMAGE: ${N8N_INSTANCE_AI_SANDBOX_IMAGE:-daytonaio/sandbox:0.5.3-slim}
      N8N_INSTANCE_AI_SANDBOX_AUTO_STOP_MINUTES: ${N8N_INSTANCE_AI_SANDBOX_AUTO_STOP_MINUTES:-15}
      N8N_INSTANCE_AI_SANDBOX_AUTO_ARCHIVE_MINUTES: ${N8N_INSTANCE_AI_SANDBOX_AUTO_ARCHIVE_MINUTES:-60}
      N8N_INSTANCE_AI_SANDBOX_AUTO_DELETE_MINUTES: ${N8N_INSTANCE_AI_SANDBOX_AUTO_DELETE_MINUTES:-10080}
